spring.application.name=library_backend
# 1. Sunucu Portu
server.port=8081

# 2. PostgreSQL Veritabanı Bağlantı Bilgileri
spring.datasource.url=jdbc:postgresql://localhost:5432/library_db
spring.datasource.username=postgres
spring.datasource.password=1283
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. Hibernate / JPA Ayarları
# 'update': Entity sınıflarında bir değişiklik yaparsak veritabanını günceller
spring.jpa.hibernate.ddl-auto=update
# Konsolda arka planda çalışan SQL sorgularını görebilmemizi sağlar
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect